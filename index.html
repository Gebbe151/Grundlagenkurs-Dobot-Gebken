<!DOCTYPE html>
<html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Robotik-Labor | Grundlagen der Robotik</title>
<style>
:root{--bg:#f3f6fa;--paper:#fff;--ink:#17283c;--muted:#52657a;--blue:#1559a7;--cyan:#dceefc;--line:#d8e2ec;--green:#14744e;--amber:#8c5200;--red:#9e2c38;--radius:16px}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:16px/1.58 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}button,input,textarea,select{font:inherit}button{cursor:pointer}.shell{max-width:1330px;margin:auto;display:grid;grid-template-columns:280px minmax(0,1fr);min-height:100vh}.sidebar{background:#102d4c;color:#fff;padding:24px 16px;position:sticky;top:0;height:100vh;overflow:auto}.brand{font-size:1.5rem;font-weight:800;line-height:1.25;margin:5px 8px 12px}.sub{color:#c6d9e9;font-size:.87rem;margin:0 8px 24px}.navbtn{display:block;text-align:left;width:100%;background:transparent;border:1px solid transparent;color:#e5f1fb;padding:11px 12px;border-radius:11px;margin:4px 0}.navbtn:hover,.navbtn.active{background:#234e77;border-color:#5e83a5}.navbtn small{display:block;opacity:.8}.navbtn .done{float:right;color:#9be4c1}.sidefoot{font-size:.82rem;color:#c6d9e9;border-top:1px solid #42617c;margin-top:25px;padding:18px 8px}main{padding:30px clamp(16px,3.5vw,55px) 80px;max-width:1030px;width:100%}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}.eyebrow{text-transform:uppercase;letter-spacing:.12em;color:var(--blue);font-weight:800;font-size:.78rem}h1{font-size:clamp(1.75rem,3vw,2.55rem);line-height:1.16;margin:10px 0}h2{font-size:1.4rem;margin:26px 0 10px}h3{font-size:1.1rem;margin:18px 0 7px}p{margin:9px 0 14px}.lead{font-size:1.12rem;color:var(--muted);max-width:780px}.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:24px;margin:18px 0;box-shadow:0 4px 18px #19344b08}.card>h2:first-child,.card>h3:first-child{margin-top:0}.note{background:#eef6fc;border-left:4px solid #2b80c7;padding:14px 16px;border-radius:7px;margin:14px 0}.warning{background:#fff5e7;border-left-color:#c17c1c}.danger{background:#fff0f1;border-left-color:#c93e4c}.success{background:#eaf8f0;border-left-color:#1a9965}.pill{display:inline-block;background:#e8f1fb;color:#1559a7;border-radius:99px;padding:3px 10px;font-size:.82rem;font-weight:700;margin:3px 4px 3px 0}.step{display:inline-flex;align-items:center;gap:8px;color:var(--blue);font-weight:800;font-size:.88rem;text-transform:uppercase;letter-spacing:.04em}.step:before{content:"";width:9px;height:9px;border-radius:50%;background:var(--blue)}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.tile{border:1px solid var(--line);padding:15px;border-radius:12px;background:#fbfdff}.tile h3{margin:0 0 5px}.tile p{margin:5px 0}.btn{background:var(--blue);color:white;border:1px solid var(--blue);border-radius:10px;padding:10px 16px;font-weight:700}.btn.secondary{background:white;color:var(--blue)}.btn.ghost{background:transparent;color:var(--blue);border-color:#b5cbe0}.btn:hover{filter:brightness(.94)}.btn:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #ec9c35;outline-offset:2px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}.field{display:block;font-weight:700;margin:15px 0 6px}.answer{width:100%;min-height:95px;resize:vertical;padding:12px;border:1px solid #aebfce;border-radius:10px;background:#fff}.small{font-size:.9rem;color:var(--muted)}.quiz{background:#f7fafc;border:1px solid #d9e5ee;border-radius:12px;padding:15px;margin:15px 0}.quiz legend{font-weight:750;margin-bottom:7px}.quiz label{display:block;padding:6px 4px;cursor:pointer}.quiz input{margin-right:9px}.feedback{margin:10px 0 0;padding:10px 12px;border-radius:9px;display:none}.feedback.visible{display:block}.feedback.ok{background:#e5f6ed;color:#0d6741}.feedback.no{background:#fff1e6;color:#824400}details{border:1px solid var(--line);border-radius:11px;background:#fff;margin:10px 0;padding:12px 15px}summary{cursor:pointer;font-weight:750;color:var(--blue)}svg{max-width:100%;height:auto}figure{margin:14px 0}figcaption{font-size:.83rem;color:var(--muted)}.figurebox{border:1px solid #d9e5ee;background:#f7fafc;border-radius:12px;padding:12px}.diagram-controls{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.diagram-controls button{background:#fff;border:1px solid #aac4df;border-radius:8px;color:#1559a7;padding:7px 11px}.diagram-controls button.selected{background:#1559a7;color:white}.progress{height:11px;background:#d7e5f1;border-radius:99px;overflow:hidden;margin:7px 0}.progress>div{height:100%;background:#2683c3;width:0;transition:width .2s}.status{font-size:.88rem;color:var(--muted)}.checkrow{display:flex;align-items:flex-start;gap:10px;padding:12px;border:1px solid var(--line);border-radius:10px;margin:12px 0}.checkrow input{margin-top:5px;transform:scale(1.2)}.navfoot{display:flex;justify-content:space-between;gap:10px;margin-top:26px}.hidden{display:none!important}.toc{padding-left:22px}.toc li{margin:8px 0}.teacher{border:1px dashed #819cb7;background:#f8fbff}.print-only{display:none}.mini{font-size:.83rem}.muted{color:var(--muted)}@media(max-width:850px){.shell{display:block}.sidebar{height:auto;position:relative;padding:14px}.brand{font-size:1.2rem}.sub{margin-bottom:10px}.nav{display:flex;overflow-x:auto;gap:5px}.navbtn{min-width:160px}.sidefoot{display:none}main{padding:18px 14px 60px}.grid2{grid-template-columns:1fr}.card{padding:18px}}@media print{.sidebar,.top,.actions,.navfoot,.diagram-controls,.btn,.no-print{display:none!important}.shell{display:block}main{max-width:100%;padding:0}.card{box-shadow:none;break-inside:avoid}body{background:#fff}.print-only{display:block}.hidden{display:block!important}}
</style></head><body><div class="shell"><aside class="sidebar"><div class="brand">🤖 ROBOTIK-LABOR</div><p class="sub">Grundlagen der Robotik<br>BG Technik · Selbstlernkurs</p><nav class="nav" id="nav"></nav><div class="sidefoot">Lernen · Experimentieren · Reflektieren<br><br>Die Ergebnisse werden als Logbuch exportiert und in LearningView abgegeben.</div></aside><main><div class="top"><div class="eyebrow">Interaktiver Grundlagenkurs · Dobot Magician</div><div><button class="btn secondary" onclick="go('log')">📘 Mein Logbuch</button></div></div><div id="content"></div></main></div>
<script>
'use strict';
const MODULES=[['home','Start & Lernmission'],['m1','1 · Robotik entdecken'],['m2','2 · Aufbau & Funktion'],['m3','3 · Kenngrößen & Koordinaten'],['m4','4 · Bewegungsarten'],['m5','5 · Greifer & Peripherie'],['m6','6 · Robotersicherheit'],['m7','7 · Robotik & KI'],['end','Abschlussauftrag'],['log','Robotik-Logbuch']];
const storeKey='robotik_grundlagen_lv_v1';let data={name:'',group:'',notes:{},done:{},safety:false};try{const saved=JSON.parse(localStorage.getItem(storeKey)||'{}');data={...data,...saved,notes:saved.notes||{},done:saved.done||{}}}catch(e){};let current='home';
function save(){try{localStorage.setItem(storeKey,JSON.stringify(data))}catch(e){}};
function esc(v){return String(v??'').replace(/[&<>"']/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]))};
function field(id,title,placeholder='Halte deine Beobachtungen, Begründungen und Ergebnisse fest.'){return `<label class="field" for="${id}">${title}</label><textarea class="answer" id="${id}" placeholder="${esc(placeholder)}" data-note="${id}">${esc(data.notes[id]||'')}</textarea>`};
function step(n,title,html){return `<section class="card"><div class="step">${n}</div><h2>${title}</h2>${html}</section>`};
function quiz(id,q,opts,correct,why){return `<fieldset class="quiz" data-quiz="${id}" data-correct="${correct}"><legend>${q}</legend>${opts.map((o,i)=>`<label><input type="radio" name="${id}" value="${i}"> ${o}</label>`).join('')}<button class="btn secondary" type="button" onclick="checkQuiz('${id}')">Antwort prüfen</button><div class="feedback" id="fb_${id}" role="status"></div><template id="ex_${id}">${esc(why)}</template></fieldset>`};
function hint(text){return `<details><summary>💡 Hinweis anzeigen</summary><p>${text}</p></details>`};
function endModule(id,requireSafety=false){return `<section class="card"><h2>Ergebnis sichern</h2><p>Prüfe, ob du die Aufgaben bearbeitet und deine Beobachtungen im Robotik-Logbuch festgehalten hast. Markiere das Modul anschließend als abgeschlossen.</p><label class="checkrow"><input type="checkbox" data-done="${id}" ${data.done[id]?'checked':''}><span><b>Ich habe die Informationen verstanden, die Aufgaben bearbeitet und meine Ergebnisse dokumentiert.</b><br><span class="small">Die Abgabe erfolgt gesammelt über LearningView.</span></span></label><div class="actions"><button class="btn secondary" onclick="go('log')">Zum Logbuch</button></div></section>`};
function robotSVG(){return `<figure class="figurebox"><svg viewBox="0 0 700 300" role="img" aria-label="Schematischer Gelenkarmroboter mit Sockel, drei Armsegmenten, Gelenken und Greifer"><rect x="25" y="245" width="650" height="28" rx="8" fill="#d7e2eb"/><rect x="90" y="207" width="110" height="42" rx="9" fill="#34678c"/><circle cx="145" cy="204" r="24" fill="#e49a33" stroke="#213a52" stroke-width="4"/><path d="M145 204 L240 108" stroke="#3178ae" stroke-width="29" stroke-linecap="round"/><circle cx="240" cy="108" r="23" fill="#e49a33" stroke="#213a52" stroke-width="4"/><path d="M240 108 L380 148" stroke="#3178ae" stroke-width="25" stroke-linecap="round"/><circle cx="380" cy="148" r="20" fill="#e49a33" stroke="#213a52" stroke-width="4"/><path d="M380 148 L470 185" stroke="#3178ae" stroke-width="16" stroke-linecap="round"/><path d="M470 185 L494 178 M470 185 L488 200" stroke="#253e54" stroke-width="8" stroke-linecap="round"/><g font-size="15" fill="#1d3a56"><text x="36" y="198">Sockel</text><text x="173" y="73">Gelenk</text><text x="278" y="75">Armsegment</text><text x="505" y="184">Endeffektor</text><text x="506" y="202">(Greifer)</text></g><g stroke="#7e9cb7" stroke-width="2" fill="none"><path d="M83 202 L114 210"/><path d="M221 77 L238 88"/><path d="M328 80 L320 124"/><path d="M503 189 L480 186"/></g></svg><figcaption>Vereinfachtes Funktionsschema eines Gelenkarmroboters; keine maßstäbliche Dobot-Konstruktionszeichnung.</figcaption></figure>`};
function coordsSVG(){return `<figure class="figurebox"><svg viewBox="0 0 620 260" role="img" aria-label="Dreidimensionales Koordinatensystem mit X Y Z Achsen und einem Punkt P"><g stroke-width="5" stroke-linecap="round"><path d="M155 197 L520 197" stroke="#d64b48"/><path d="M155 197 L35 70" stroke="#2a8a68"/><path d="M155 197 L155 20" stroke="#246cbd"/></g><g font-size="20" font-weight="bold"><text x="525" y="205" fill="#d64b48">+X</text><text x="10" y="64" fill="#2a8a68">+Y</text><text x="167" y="26" fill="#246cbd">+Z</text></g><g stroke="#8b9dad" stroke-dasharray="6 5" stroke-width="2"><path d="M310 127 L310 197 M310 127 L215 30"/></g><circle cx="310" cy="127" r="8" fill="#ed9c2c"/><text x="323" y="124" font-size="18">P (x, y, z)</text><text x="164" y="215" font-size="16">O</text></svg><figcaption>Schematische Darstellung: Positive Richtungen sind markiert. Die tatsächlichen Achsrichtungen am Dobot müssen am Gerät überprüft werden.</figcaption></figure>`};
function pathSVG(){return `<div class="figurebox"><svg viewBox="0 0 680 270" role="img" aria-label="Vergleich schematischer Bewegungsbahnen zwischen A und B"><rect x="25" y="215" width="630" height="16" rx="4" fill="#bdcbd6"/><rect x="305" y="138" width="75" height="77" fill="#f0b870" stroke="#9a662c"/><circle cx="85" cy="170" r="9" fill="#1467ac"/><circle cx="590" cy="170" r="9" fill="#1467ac"/><text x="70" y="196" font-size="18">A</text><text x="600" y="196" font-size="18">B</text><path id="movj" d="M85 170 Q235 20 590 170" fill="none" stroke="#ba4884" stroke-width="6" stroke-dasharray="10 7"/><path id="movl" d="M85 170 L590 170" fill="none" stroke="#ca463f" stroke-width="6"/><path id="jump" d="M85 170 L85 62 L590 62 L590 170" fill="none" stroke="#168b68" stroke-width="6"/><text x="280" y="255" font-size="15">Hindernis zwischen A und B</text></svg><div class="diagram-controls"><button onclick="pathShow('movj',this)">MOVJ: schematisch</button><button onclick="pathShow('movl',this)">MOVL</button><button onclick="pathShow('jump',this)" class="selected">JUMP: schematisch</button></div><p class="small" id="pathCaption">JUMP: konzeptionelle Hub-/Transport-/Absenkbewegung. Die konkrete Dobot-Implementierung und Parameter bestimmen die reale Bahn.</p><p class="small"><b>Wichtig:</b> Die gezeichnete MOVJ-Kurve ist nur eine Veranschaulichung. Bei Gelenkbewegungen ist die reale TCP-Bahn nicht allgemein vorhersagbar und muss vor einem Einsatz kollisionsgeprüft werden.</p></div>`};
const pages={
home:()=>`<div class="eyebrow">Willkommen im Robotik-Labor</div><h1>Kannst du einen Roboter verstehen, bevor du ihn programmierst?</h1><p class="lead">In diesem Kurs untersuchst du, wie Roboter aufgebaut sind, wie sie sich bewegen, welche Werkzeuge sie benötigen und wie Menschen sicher mit ihnen arbeiten. Am Dobot Magician überprüfst du deine Erkenntnisse.</p><div class="card"><h2>Deine Lernmission</h2><p>Ein Betrieb möchte einen wiederkehrenden Handhabungsschritt automatisieren: Ein Werkstück soll aufgenommen und an einer anderen Stelle abgelegt werden. Bevor du den Roboter später selbst programmierst, musst du als Ingenieurteam seine Möglichkeiten, Grenzen und Risiken kennen.</p><div class="grid2"><div class="tile"><h3>📚 Wissen aufbauen</h3><p>Informationen sind direkt im Kurs enthalten. Externe Recherche ist nur bei Zusatzaufgaben nötig.</p></div><div class="tile"><h3>🤖 Praxis erleben</h3><p>Du beobachtest und untersuchst den Dobot. Praktische Bewegungen nur nach Sicherheitsfreigabe.</p></div><div class="tile"><h3>🧠 Selbst kontrollieren</h3><p>Wissensfragen liefern sofort Rückmeldung. Hinweise sind freiwillig abrufbar.</p></div><div class="tile"><h3>📘 In LearningView sichern</h3><p>Dein Logbuch sammelt die Antworten. Exportiere es am Ende und lade es in LearningView hoch.</p></div></div></div><section class="card"><h2>Bevor du beginnst</h2><div class="grid2"><div><label class="field" for="name">Vor- und Nachname</label><input id="name" class="answer" style="min-height:45px" value="${esc(data.name)}" placeholder="Name" oninput="data.name=this.value;save()"></div><div><label class="field" for="group">Klasse / Team</label><input id="group" class="answer" style="min-height:45px" value="${esc(data.group)}" placeholder="z. B. BGE3-1 / Team A" oninput="data.group=this.value;save()"></div></div><div class="note warning"><b>Sicherheitsregel:</b> Bis zur Unterweisung und ausdrücklichen Freigabe durch die Lehrkraft bleiben alle Roboterbewegungen aus. Die Erkundungsaufgaben lassen sich zunächst durch Beobachten, Skizzieren und Besprechen bearbeiten.</div><h3>Dein Arbeitsweg</h3><ol class="toc"><li>Bearbeite die Module in Reihenfolge.</li><li>Lies die Infokarten und beantworte die Fragen.</li><li>Dokumentiere Beobachtungen im Logbuch.</li><li>Führe Praxisversuche nur nach Freigabe durch.</li><li>Exportiere dein Logbuch und gib es in LearningView ab.</li></ol><div class="actions"><button class="btn" onclick="go('m1')">Kurs starten →</button></div></section>`,
m1:()=>`<div class="eyebrow">Modul 1 · Einstieg</div><h1>Robotik entdecken: Was würdest du automatisieren?</h1><p class="lead">Roboter begegnen uns in Fertigung, Logistik, Medizin und Alltag. Welche Aufgaben eignen sich – und welche nicht?</p>${step('Entdecken','Die Einstiegsfrage',`<div class="note"><b>Stell dir vor, du könntest einen Roboter entwickeln, der im Alltag oder in der Arbeitswelt eine Aufgabe übernimmt: Welche Aufgabe würdest du automatisieren, wie müsste der Roboter funktionieren und wo könnten Probleme entstehen?</b></div><p><b>Think (2 min):</b> Sammle eigene Ideen. <b>Pair (4 min):</b> Vergleiche und diskutiere mit einer Partnerin oder einem Partner. <b>Share (5 min):</b> Stellt eure überzeugendste Idee vor.</p>${field('m1_idea','Meine Automatisierungsidee und die Aufgabe des Roboters')}${field('m1_discuss','Unsere Diskussion: Chancen, Einwände und offene Fragen')}`)}${step('Informieren','Was ist ein Roboter – und was bedeutet Automatisierung?',`<p><b>Automatisierung</b> bedeutet, dass ein technisches System einen Ablauf ganz oder teilweise selbstständig nach festgelegten Regeln ausführt. Ein <b>Industrieroboter</b> ist ein automatisch gesteuerter, umprogrammierbarer, vielseitig einsetzbarer Manipulator mit mehreren Bewegungsachsen. Ein Robotersystem umfasst meist mehr als den Roboterarm: etwa Steuerung, Greifer, Sensoren und Zuführtechnik.</p><p><b>Beispiele:</b> Schweißroboter in der Fahrzeugfertigung, Bestückungsroboter in der Elektronik, Palettierroboter in der Logistik und Assistenzroboter in der Medizin. Nicht jedes automatische Gerät ist ein Industrieroboter: Ein Förderband kann automatisiert sein, ohne selbst ein Roboter zu sein.</p><div class="grid2"><div class="tile"><h3>Stärken</h3><p>Wiederholbarkeit, konstante Prozessabläufe, Einsatz bei monotonen oder gefährlichen Tätigkeiten, planbare Taktzeiten.</p></div><div class="tile"><h3>Grenzen</h3><p>Kosten, Einrichtung, Wartung, technische Störungen, begrenzter Arbeitsraum, Sicherheitsanforderungen und fehlende Flexibilität ohne passende Sensorik/Software.</p></div></div>`)}${step('Verstehen','Wissen überprüfen',quiz('q1','Welche Aussage beschreibt Automatisierung am besten?',['Jede Maschine ist automatisch ein Roboter.','Ein technisches System führt einen Ablauf ganz oder teilweise selbstständig aus.','Nur KI-gesteuerte Systeme können automatisiert sein.'],1,'Automatisierung benötigt nicht zwingend einen Roboter oder KI.'))}${step('Ausprobieren','Erkundung des Dobot – zunächst ohne Bewegung',`<p>Betrachte den Roboter aus sicherem Abstand. Identifiziere Roboterarm, Sockel, Gelenke, Endeffektor, Steuerung und Verbindungskabel. Zeichne ein beschriftetes Funktionsschema.</p><div class="note warning">Der Roboter bleibt während dieser ersten Erkundung ausgeschaltet beziehungsweise in dem von der Lehrkraft vorgegebenen sicheren Zustand.</div>${field('m1_parts','Beobachtete Komponenten und vermutete Funktionen')}${hint('Denke an Mechanik (Arm/Gelenke), Aktorik (Antriebe), Steuerung, Werkzeug und mögliche Sensoren.')}`)}${step('Reflektieren','Transfer',`<p>Welche der anfangs genannten Aufgaben wäre für einen einfachen Dobot besonders gut geeignet? Begründe anhand von Werkstück, Bewegung und Umgebung.</p>${field('m1_transfer','Unsere begründete Auswahl')}`)}${endModule('m1')}`,
m2:()=>`<div class="eyebrow">Modul 2 · Mechanik</div><h1>Aufbau und Funktionsweise eines Roboters</h1><p class="lead">Wie entsteht aus mehreren Gelenken eine gezielte Werkzeugbewegung?</p>${step('Informieren','Vom Antrieb zum Werkzeug',`${robotSVG()}<p>Die <b>Steuerung</b> verarbeitet Befehle und Sensorsignale. <b>Antriebe</b> bewegen die Gelenke. <b>Armsegmente</b> verbinden die Gelenke. Am Ende befindet sich der <b>Endeffektor</b>, zum Beispiel ein Greifer. Die Beweglichkeit ergibt sich aus der Anordnung der Achsen – der <b>Kinematik</b>.</p><p><b>Freiheitsgrad (DOF):</b> Eine unabhängige Bewegungsmöglichkeit. Ein frei beweglicher starrer Körper besitzt im Raum drei translatorische und drei rotatorische Freiheitsgrade. Die Zahl der Roboterachsen und die tatsächlich erreichbaren Werkzeuglagen müssen jedoch unterschieden werden.</p><p>Der <b>Dobot Magician</b> besitzt nach den bereitgestellten Geräteunterlagen vier steuerbare Achsen/Freiheitsgrade. Ein typischer <b>UR5e</b> besitzt sechs Drehachsen. Die konkrete Kinematik beeinflusst, welche Positionen und Werkzeugorientierungen erreichbar sind.</p><div class="grid2"><div class="tile"><h3>Portalroboter</h3><p>Meist translatorische Linearachsen; gut für geradlinige Bewegungen in einem rechteckigen Arbeitsbereich.</p></div><div class="tile"><h3>SCARA</h3><p>Besonders für schnelle Montage- und Positionieraufgaben in überwiegend horizontaler Ebene.</p></div><div class="tile"><h3>Delta-Roboter</h3><p>Parallele Kinematik, häufig für sehr schnelle Pick-and-Place-Anwendungen.</p></div><div class="tile"><h3>Gelenkarmroboter</h3><p>Serielle Kinematik mit mehreren Drehgelenken; flexibel für Handhabung, Montage oder Schweißen.</p></div></div>`)}${step('Verstehen','Kinematik prüfen',`${quiz('q2','Warum sind sechs Freiheitsgrade für viele industrielle Aufgaben nützlich?',['Damit ausschließlich die Geschwindigkeit steigt.','Damit die Position und die Orientierung des Werkzeugs im Raum beeinflusst werden können.','Weil jeder Roboter sechs Motoren besitzen muss.'],1,'Eine räumliche Werkzeuglage umfasst drei Positions- und drei Orientierungsgrößen. Nicht jede Lage ist wegen Gelenkgrenzen erreichbar.')}${quiz('q2b','Welche Bauform ist für sehr schnelle Pick-and-Place-Prozesse häufig geeignet?',['Delta-Roboter','Drehmaschine','Förderband ohne Roboter'],0,'Delta-Roboter werden oft für schnelle Handhabungsaufgaben eingesetzt.')}`)}${step('Ausprobieren','Achsen untersuchen',`<div class="note danger"><b>Praxisfreigabe erforderlich:</b> Bewegungsversuche nur nach Unterweisung, Prüfung des Arbeitsplatzes und ausdrücklicher Freigabe durch die Lehrkraft. Ausschließlich die freigegebene Bedienart verwenden. Keine Bewegung von Hand gegen verriegelte Antriebe erzwingen.</div><p><b>Auftrag:</b> Beobachte nacheinander einzelne, von der Lehrkraft freigegebene Achsbewegungen. Beschreibe für jede Achse, welches Gelenk sich bewegt und wie sich die Lage des Werkzeugs verändert. Zeichne die Achsen in deine Roboterskizze ein.</p>${field('m2_axes','Achsenbeobachtung: Achse – Gelenkbewegung – Wirkung am Werkzeug')}${hint('Unterscheide die Drehung eines Gelenks von der geradlinig erscheinenden Bewegung des Werkzeugs.')}`)}${step('Reflektieren','Technische Entscheidung',`<p>Warum wäre ein Portalroboter für bestimmte Aufgaben besser geeignet als ein Gelenkarmroboter – und umgekehrt?</p>${field('m2_compare','Vergleich mit zwei begründeten Anwendungsfällen')}`)}${endModule('m2')}`,
m3:()=>`<div class="eyebrow">Modul 3 · Positionen</div><h1>Kenngrößen, Arbeitsraum und Koordinatensysteme</h1><p class="lead">Wo befindet sich das Werkzeug, welche Last kann der Roboter tragen und wie genau wiederholt er eine Bewegung?</p>${step('Informieren','Wichtige Roboterkenngrößen',`<div class="grid2"><div class="tile"><h3>Geometrische Kenngrößen</h3><p>Reichweite, Arbeitsraum, Abmessungen und Gelenkgrenzen. Der <b>Arbeitsraum</b> enthält erreichbare Positionen; der <b>Bewegungsraum</b> umfasst die beim Verfahren überstrichenen Bereiche des Systems.</p></div><div class="tile"><h3>Belastungskenngrößen</h3><p>Nenntraglast, zulässige Werkzeug- und Werkstückmassen sowie deren Schwerpunkt. Die Masse des Greifers muss berücksichtigt werden.</p></div><div class="tile"><h3>Kinematische Kenngrößen</h3><p>Geschwindigkeiten und Beschleunigungen von Gelenken oder Werkzeug; abhängig von Roboter und Betriebsbedingungen.</p></div><div class="tile"><h3>Genauigkeitskenngrößen</h3><p><b>Wiederholgenauigkeit</b> beschreibt, wie eng wiederholt erreichte Positionen beieinanderliegen. <b>Absolute Positioniergenauigkeit</b> betrifft die Abweichung zur Sollposition – beides ist nicht identisch.</p></div></div><p>Die bereitgestellte Dobot-Unterlage nennt für den Magician unter anderem <b>500 g maximale Nutzlast</b>, <b>320 mm Reichweite</b> und <b>±0,2 mm Wiederholgenauigkeit</b>. Diese Daten beziehen sich auf die dokumentierte Geräteausführung und sind keine Aufforderung, Grenzwerte experimentell auszureizen.</p>${coordsSVG()}<p>Ein <b>Koordinatensystem</b> beschreibt Positionen mit Zahlenwerten, etwa X, Y und Z. Ein <b>Nullpunkt</b> ist der Bezugspunkt. Das Werkzeugzentrum heißt <b>TCP (Tool Center Point)</b>. Die TCP-Lage und die Bezugssysteme müssen korrekt eingerichtet sein, damit eine Position sinnvoll interpretiert werden kann.</p>`)}${step('Verstehen','Begriffe anwenden',`${quiz('q3','Was beschreibt Wiederholgenauigkeit?',['Wie eng der Roboter bei Wiederholungen dieselbe Position erreicht.','Wie schwer der Roboter ist.','Ob der Roboter den Nullpunkt auf Anhieb absolut exakt trifft.'],0,'Wiederholgenauigkeit und absolute Genauigkeit sind unterschiedliche Eigenschaften.')}${quiz('q3b','Warum zählt die Masse des Greifers bei der Traglastbetrachtung mit?',['Weil der Greifer selbst vom Roboter getragen wird.','Weil ein Greifer immer schwerer als das Werkstück ist.','Sie zählt nicht mit.'],0,'Greifer und Werkstück belasten gemeinsam das Robotersystem.')}`)}${step('Ausprobieren','Koordinaten am Dobot erkunden',`<p><b>Nach Freigabe:</b> Beobachte langsame Bewegungen in positiver und negativer X-, Y- und Z-Richtung. Nutze das vorhandene Dobot-Bodenblatt. Notiere, welche Bewegungen du erwartest und was tatsächlich geschieht. Halte sichere Grenzen und die Bedienvorgaben ein.</p><div class="note warning">Die im Diagramm dargestellten Achsrichtungen sind ein Lernschema, keine verbindliche Anleitung für die reale Roboterzelle. Keine selbst gewählten Grenzpositionen oder Traglasttests.</div>${field('m3_predict','Vorhersage und Beobachtung: +X / −X / +Y / −Y / +Z')}${field('m3_terms','Erkläre Arbeitsraum, Bewegungsraum, Nullpunkt und TCP an deinem Dobot.')}${hint('Prüfe zuerst, welches Bezugssystem die Software aktuell anzeigt. Die Bewegung des Endeffektors ist nicht mit der Bewegung eines einzelnen Gelenks gleichzusetzen.')}`)}${step('Reflektieren','Ein Problem aus der Praxis',`<p>Ein Roboter greift ein Werkstück an zehn aufeinanderfolgenden Durchläufen fast immer an derselben Stelle, aber jeweils 3 mm neben der gewünschten Position. Welche Kenngröße könnte gut sein und welche möglicherweise nicht?</p>${field('m3_accuracy','Deine fachliche Erklärung')}`)}${endModule('m3')}`,
m4:()=>`<div class="eyebrow">Modul 4 · Bahnplanung</div><h1>Bewegungsarten: Nicht jeder Weg führt gleich zum Ziel</h1><p class="lead">Zwei Punkte können auf unterschiedlichen Bahnen verbunden werden. Für einen sicheren Prozess ist die Bahnwahl entscheidend.</p>${step('Informieren','MOVJ, MOVL, ARC und JUMP',`<div class="grid2"><div class="tile"><h3>PTP / MOVJ</h3><p>Der Roboter bewegt seine Gelenke zu einer Zielkonfiguration. Der TCP fährt dabei im Allgemeinen <b>keine vorgegebene Gerade</b>. Gut für viele freie Transferbewegungen, aber Bahn und Kollisionen müssen geprüft werden.</p></div><div class="tile"><h3>LIN / MOVL</h3><p>Der TCP folgt einer <b>geraden Bahn</b> zwischen den programmierten Werkzeuglagen. Sinnvoll etwa beim geradlinigen Anfahren eines Werkstücks.</p></div><div class="tile"><h3>CIRC / ARC</h3><p>Der TCP folgt einer definierten <b>Kreisbahn</b> beziehungsweise einem Kreisbogen, wenn die Software und die Kinematik diese Bewegung unterstützen.</p></div><div class="tile"><h3>JUMP</h3><p>Dobot-spezifische Hub-/Transfer-/Absenkbewegung. Die genaue Bahn ergibt sich aus den Softwareeinstellungen; nicht als grundsätzlich kollisionsfrei ansehen.</p></div></div>${pathSVG()}`)}${step('Verstehen','Entscheidungen treffen',`${quiz('q4','Welche Bewegungsart beschreibt eine geradlinige TCP-Bahn?',['MOVJ','MOVL','Jede Gelenkbewegung'],1,'Bei MOVL wird die TCP-Bahn geradlinig vorgegeben.')}${quiz('q4b','Warum ist MOVJ bei einem Hindernis besonders sorgfältig zu prüfen?',['Weil die tatsächliche TCP-Bahn nicht einfach als Gerade angenommen werden darf.','Weil MOVJ grundsätzlich verboten ist.','Weil MOVJ immer dieselbe Kreisbahn fährt.'],0,'Gelenkbewegungen führen nicht allgemein zu einer vorhersehbaren geraden TCP-Bahn.')}`)}${step('Ausprobieren','Bewegungen beobachten und vergleichen',`<p>Die Lehrkraft stellt einen <b>vorab geprüften, langsamen und sicheren Demonstrationsablauf</b> für unterschiedliche Bewegungsarten bereit. Beobachte jeweils den Weg des Werkzeugs zwischen denselben Ausgangs- und Zielpositionen. Nutze das vorhandene Dobot-Bodenblatt mit A/B-Bewegung.</p><p>Zeichne die beobachteten Bahnen in einer Skizze ein und beurteile, ob sie für einen Werkstücktransport mit Hindernis geeignet wären. Du programmierst in diesem Kurs <b>noch keine eigenen Wegpunkte</b>.</p><div class="note danger">Die Grafik oben ist kein Bewegungsprogramm. Keine Bewegung durch ein Hindernis demonstrieren oder provozieren. Die reale Bahn muss vor der Vorführung durch die Lehrkraft geprüft sein.</div>${field('m4_observe','Vergleich: MOVJ – MOVL – JUMP (Bahn, Vorteile, Risiken)')}${field('m4_choice','Welche Bewegungsart eignet sich für das sichere Anfahren eines Werkstücks? Begründe.')}${hint('Unterscheide die Bewegung direkt am Werkstück von der Bewegung zwischen weit voneinander entfernten Positionen.')}`)}${step('Reflektieren','Technischer Merksatz',`<p>Formuliere einen Merksatz, warum die Zielposition allein nicht ausreicht, um eine Roboterbewegung zu beurteilen.</p>${field('m4_rule','Mein Merksatz')}`)}${endModule('m4')}`,
m5:()=>`<div class="eyebrow">Modul 5 · Handhabung</div><h1>Greifersysteme und Roboterperipherie</h1><p class="lead">Ein Roboterarm kann sich bewegen. Erst mit passenden Werkzeugen und Komponenten wird daraus eine nützliche Anlage.</p>${step('Informieren','Wie nimmt ein Roboter Werkstücke auf?',`<div class="grid2"><div class="tile"><h3>Vakuumgreifer</h3><p>Hält Werkstücke durch Unterdruck an einer geeigneten Kontaktfläche. Gut bei glatten, ausreichend dichten Oberflächen; problematisch bei porösen oder stark unebenen Flächen.</p></div><div class="tile"><h3>Mechanischer / pneumatischer Greifer</h3><p>Greifbacken halten das Werkstück durch Kraft- oder Formschluss. Pneumatische Greifer nutzen Druckluft; geeignet je nach Geometrie und benötigter Greifkraft.</p></div><div class="tile"><h3>Elektrischer Greifer</h3><p>Motorisch angetriebene Greifbewegung, häufig mit steuerbaren Positionen und Kräften.</p></div><div class="tile"><h3>Magnetgreifer</h3><p>Für geeignete ferromagnetische Werkstoffe. Nicht für beliebige Metalle oder Kunststoffe einsetzbar.</p></div></div><p><b>Peripherie</b> umfasst zusätzliche Komponenten wie Sensoren, Förderbänder, Werkstückspeicher, Spannmittel, Kameras und Prüfsysteme. <b>Sensoren</b> liefern Informationen, etwa ob ein Werkstück vorhanden ist. <b>Aktoren</b> bewirken eine Handlung, etwa Greifer schließen oder Förderband bewegen.</p>`)}${step('Verstehen','Welcher Greifer passt?',`${quiz('q5','Welcher Greifer ist für eine glatte, ausreichend dichte Kunststoffplatte häufig geeignet?',['Vakuumgreifer','Magnetgreifer','Keiner – Kunststoff ist grundsätzlich nicht greifbar'],0,'Ein Vakuumgreifer kann bei geeigneter Oberfläche gut funktionieren.')}${quiz('q5b','Welche Aufgabe erfüllt ein Werkstücksensor am Förderband?',['Er meldet zum Beispiel, ob ein Werkstück an einer Position vorhanden ist.','Er ersetzt alle Schutzmaßnahmen.','Er trägt das Werkstück.'],0,'Ein Sensor liefert eine Information für die Steuerung, ersetzt aber keine Sicherheitsfunktion.')}`)}${step('Ausprobieren','Greifer als Ingenieurteam beurteilen',`<p>Untersucht – zunächst ohne Werkzeugwechsel – die vorhandenen Greifersysteme am Dobot. Vergleicht Kontaktfläche, Funktionsprinzip, mögliche Werkstückformen und Grenzen. Ein Wechsel oder Anschluss erfolgt ausschließlich durch die Lehrkraft oder unter ihrer unmittelbaren Anleitung gemäß Geräteunterlagen.</p><p><b>Optionale Demonstration:</b> Die Lehrkraft zeigt einen geprüften Aufnahme- und Ablagevorgang mit einem geeigneten Werkstück.</p>${field('m5_compare','Vergleich von mindestens zwei Greifern: Prinzip, Werkstück, Vorteil, Grenze')}${field('m5_select','Entscheidung: Welchen Greifer wählst du für ein Kunststoffteil mit Loch? Begründe und nenne offene Prüffragen.')}${hint('Frage nach Oberfläche, Masse, Geometrie, Kontaktfläche, Druckluft/Vakuum und Gefahr des Herunterfallens.')}`)}${step('Reflektieren','Mehr als ein Roboterarm',`<p>Ein Werkstück soll automatisch vom Förderband gegriffen werden. Welche zusätzlichen Komponenten wären notwendig und welche Informationen müssen sie austauschen?</p>${field('m5_cell','Meine vereinfachte Anlagenbeschreibung (Sensor → Steuerung → Aktor/Greifer)')}`)}${endModule('m5')}`,
m6:()=>`<div class="eyebrow">Modul 6 · Verantwortung</div><h1>Robotersicherheit: Risiken erkennen und beherrschen</h1><p class="lead">Eine Bewegung ist erst dann technisch sinnvoll, wenn Menschen und Umgebung ausreichend geschützt sind.</p>${step('Informieren','Sicherheitsgrundlagen',`<div class="note danger"><b>Verbindlich für diesen Kurs:</b> Nur nach Einweisung und Freigabe arbeiten. Während automatischer Bewegungen nicht in den Arbeitsbereich greifen. Keine Schutzfunktionen umgehen, keine Sicherheitsparameter ändern, keine ungeprüften Werkzeuge montieren. Bei einer Störung nicht eigenständig in den Gefahrenbereich eingreifen; Lehrkraft informieren.</div><p><b>Gefährdungen</b> entstehen unter anderem durch unerwartete Bewegungen, Quetsch- und Scherstellen, Kollisionen, herabfallende Werkstücke, spitze Werkzeuge, elektrische Energie oder Druckluft. Auch scheinbar langsame Roboter können gefährlich sein.</p><p>Eine <b>Risikobeurteilung</b> untersucht eine konkrete Aufgabe: <b>Gefährdung identifizieren → mögliche Schäden und Eintrittsbedingungen beurteilen → geeignete Maßnahmen auswählen → Wirksamkeit prüfen</b>. Technische Schutzmaßnahmen haben grundsätzlich Vorrang vor reinen Verhaltenshinweisen.</p><p><b>Schutzmaßnahmen</b> können je nach Anlage trennende Schutzeinrichtungen, sicherheitsgerichtete Sensoren, sichere Betriebsarten, Geschwindigkeitsbegrenzungen, geeignete Stoppfunktionen und organisatorische Regeln sein. Ein Not-Halt ist eine wichtige ergänzende Funktion, ersetzt aber kein umfassendes Sicherheitskonzept.</p><p><b>Kollaborierender Roboter (Cobot)</b> bedeutet nicht automatisch gefahrlos. Die Sicherheit hängt von der gesamten Anwendung ab – einschließlich Werkzeug, Werkstück, Bewegung und Umgebung.</p><div class="note warning"><b>Wichtig zur bereitgestellten UR5e-Schulungszelle:</b> Die Betriebsanleitung fordert kontinuierliche qualifizierte Aufsicht und verbietet insbesondere, dass eine Lehrkraft mehrere gleichzeitig arbeitende Gruppen beaufsichtigt. Diese Regel ist bei späteren UR5e-Praxiseinheiten verbindlich zu berücksichtigen.</div>`)}${step('Verstehen','Sicherheit prüfen',`${quiz('q6','Ist ein kollaborierender Roboter grundsätzlich ungefährlich?',['Ja, die Bauart macht jede Anwendung sicher.','Nein, die gesamte Anwendung muss betrachtet und abgesichert werden.','Nur wenn er eine Kamera besitzt.'],1,'Auch Werkzeug, Werkstück und Prozess können Gefährdungen erzeugen.')}${quiz('q6b','Welche Aussage zum Not-Halt ist richtig?',['Er ersetzt die Risikobeurteilung.','Er ist eine ergänzende Schutzmaßnahme und kein Ersatz für eine sichere Anlage.','Er muss im normalen Betrieb ständig betätigt sein.'],1,'Ein Not-Halt ersetzt nicht die übrigen Schutzmaßnahmen.')}`)}${step('Anwenden','Fallstudie: Laserbeschriftung',`<p>Ein Dobot soll mit einem Laser Handyhüllen beschriften. Eine Person legt die Hülle ein und nimmt sie nach der Bearbeitung heraus. <b>Diese Aufgabe ist ausschließlich eine theoretische Sicherheitsanalyse; es wird kein Laser aufgebaut oder betrieben.</b></p><ol><li>Ermittle mindestens fünf mögliche Gefährdungen.</li><li>Ordne jeder Gefährdung mindestens eine geeignete Schutzidee zu.</li><li>Erkläre, weshalb eine bloße Warnung „Vorsicht Laser!“ nicht ausreicht.</li></ol>${field('m6_risk','Gefährdung → mögliche Folge → geeignete Schutzmaßnahme')}${hint('Denke an Strahlung, Zugang zum Arbeitsraum, unerwarteten Start, bewegte Achsen, Werkstückpositionierung und Freigabe nach Bearbeitungsende.')}`)}${step('Reflektieren','Sicherheitsfreigabe begründen',`<p>Welche drei Prüfungen sollte ein Team vor einem freigegebenen Roboterexperiment durchführen? Nutze dabei die für eure Anlage gültigen Anweisungen der Lehrkraft.</p>${field('m6_check','Meine drei wichtigsten Prüfpunkte')}`)}${endModule('m6')}`,
m7:()=>`<div class="eyebrow">Modul 7 · Zukunft</div><h1>Robotik und künstliche Intelligenz</h1><p class="lead">Wie wird aus einem festen Bewegungsablauf ein System, das auf wechselnde Situationen reagieren kann?</p>${step('Entdecken','Das Sortierproblem',`<p>Ein Roboter greift ein Bauteil zuverlässig an einer festen Position. Nun liegen die Bauteile ungeordnet und in unterschiedlichen Ausrichtungen auf einem Förderband. Wie könnte das System trotzdem die richtige Greifposition finden?</p>${field('m7_idea','Unsere erste Lösungsidee: Welche Informationen fehlen dem Roboter?')}`)}${step('Informieren','Klassische Steuerung, Sensorik und KI unterscheiden',`<p><b>Klassische Ablaufsteuerung:</b> Ein Programm führt festgelegte Regeln aus, etwa „Wenn Lichtschranke belegt, Förderband stoppen“. Solche Systeme können sehr zuverlässig sein und benötigen nicht zwingend KI.</p><p><b>Bildverarbeitung:</b> Eine Kamera liefert Bilder. Mit klassischer Bildverarbeitung oder KI-Methoden lassen sich beispielsweise Positionen, Konturen oder Objektklassen bestimmen. Nicht jede Kameralösung verwendet KI.</p><p><b>Maschinelles Lernen:</b> Ein Modell lernt statistische Zusammenhänge aus Trainingsdaten. Es kann etwa Bauteile auf Bildern klassifizieren, macht aber auch Fehler und kann bei ungewohnten Situationen unzuverlässig werden.</p><div class="figurebox"><svg viewBox="0 0 700 110" role="img" aria-label="Informationskette Kamera, Bildauswertung, Entscheidung, Roboter"><g font-size="18" font-weight="bold" text-anchor="middle"><rect x="10" y="18" width="138" height="64" rx="12" fill="#e2effb" stroke="#7aaad4"/><text x="79" y="56">Kamera</text><rect x="190" y="18" width="138" height="64" rx="12" fill="#e2effb" stroke="#7aaad4"/><text x="259" y="56">Auswertung</text><rect x="370" y="18" width="138" height="64" rx="12" fill="#e2effb" stroke="#7aaad4"/><text x="439" y="56">Entscheidung</text><rect x="550" y="18" width="138" height="64" rx="12" fill="#e2effb" stroke="#7aaad4"/><text x="619" y="56">Roboter</text></g><g stroke="#235f96" stroke-width="4" fill="none"><path d="M148 50 L190 50 M328 50 L370 50 M508 50 L550 50"/></g></svg><figcaption>Prinzipkette zur Objekterkennung und Handhabung. Jede Stufe muss hinsichtlich Fehlern und Sicherheit bewertet werden.</figcaption></div><div class="grid2"><div class="tile"><h3>Chancen</h3><p>Flexiblere Sortierung, Erkennung variierender Werkstücke, automatische Qualitätsprüfung, Anpassung an wechselnde Produktionsbedingungen.</p></div><div class="tile"><h3>Risiken und Grenzen</h3><p>Fehlerhafte Erkennung, ungeeignete Trainingsdaten, eingeschränkte Nachvollziehbarkeit, Datenschutz, Kosten, Verantwortung und notwendige Absicherung sicherheitskritischer Entscheidungen.</p></div></div><p><b>Wichtig:</b> Eine KI-Entscheidung ersetzt keine erforderliche funktionale Sicherheit. Die Sicherheit einer Roboteranlage darf nicht ungeprüft von einer fehleranfälligen Objekterkennung abhängen.</p>`)}${step('Verstehen','KI realistisch einschätzen',`${quiz('q7','Welche Aussage ist richtig?',['Jede Lichtschranke arbeitet mit KI.','Ein System kann Werkstücke mit festen Regeln automatisiert sortieren, ohne KI zu verwenden.','KI erkennt alle unbekannten Gegenstände fehlerfrei.'],1,'Automatisierung und KI sind unterschiedliche Konzepte.')}${quiz('q7b','Welche Schwierigkeit kann beim KI-basierten Erkennen entstehen?',['Das System kann Objekte falsch klassifizieren.','Die Kamera benötigt niemals Beleuchtung.','Die KI macht Sicherheitsmaßnahmen überflüssig.'],0,'Fehlklassifikationen und wechselnde Umgebungsbedingungen müssen berücksichtigt werden.')}`)}${step('Anwenden','Ingenieurentscheidung',`<p>Entwickelt ein Konzept für eine Sortieranlage mit Kamera. Vergleicht eine Lösung mit fest programmierten Regeln und eine Lösung mit KI-Unterstützung. Diskutiert: Wann lohnt sich der zusätzliche Aufwand?</p>${field('m7_compare','Vergleich: klassische Automation und KI-Unterstützung')}${field('m7_risks','Mindestens zwei Chancen und drei Risiken – mit Maßnahmen gegen die Risiken')}`)}${step('Reflektieren','Position beziehen',`<p><b>Diskussionsfrage:</b> Welche Entscheidungen sollte eine KI in einer Roboteranlage selbst treffen dürfen – und bei welchen muss ein Mensch oder eine unabhängige Sicherheitsfunktion die Kontrolle behalten?</p>${field('m7_opinion','Meine begründete Position')}`)}${endModule('m7')}`,
end:()=>`<div class="eyebrow">Abschluss · Transfer</div><h1>Ingenieurauftrag: Die Roboterzelle verstehen</h1><p class="lead">Du programmierst noch nicht selbst. Du zeigst aber, dass du eine Handhabungsaufgabe fachlich durchdenken kannst.</p>${step('Auftrag','Entwirf eine einfache Roboterzelle',`<div class="note"><b>Ausgangssituation:</b> Ein Kunststoffwerkstück soll von einer Bereitstellungsposition auf eine Ablageposition transportiert werden. Zwischen beiden Bereichen kann sich ein Hindernis befinden. Die spätere Anlage soll sicher und möglichst zuverlässig arbeiten.</div><ol><li>Wähle eine geeignete Roboterbauform und begründe.</li><li>Beschreibe notwendige Komponenten: Roboter, Greifer, Sensorik und Steuerung.</li><li>Skizziere einen sinnvollen Bewegungsablauf mit sicherer Annäherung und Rückzug.</li><li>Begründe die Auswahl der Bewegungsarten.</li><li>Nenne mindestens vier Risiken und passende Schutzmaßnahmen.</li><li>Erkläre, ob KI für diesen konkreten Prozess einen Mehrwert hätte.</li></ol>${field('end_plan','Mein Anlagenkonzept (Komponenten und Ablauf)')}${field('end_motion','Bewegungsarten und ihre Begründung')}${field('end_safety','Gefährdungen und Schutzmaßnahmen')}${field('end_ai','KI: sinnvoll oder unnötig? Begründung')}`)}${step('Selbstbewertung','Das kann ich jetzt',`<p>Bewerte deinen Lernstand ehrlich und notiere offene Fragen für den Programmierkurs.</p>${['Ich kann typische Roboterbauformen und Einsatzbereiche erläutern.','Ich kann Achsen, Freiheitsgrade und wichtige Kenngrößen erklären.','Ich kann MOVJ, MOVL und JUMP fachlich unterscheiden.','Ich kann einen Greifer für eine Handhabungsaufgabe begründet auswählen.','Ich kann grundlegende Gefährdungen und Schutzmaßnahmen benennen.','Ich kann klassische Automation und KI-Unterstützung unterscheiden.'].map((x,i)=>`<label class="checkrow"><input type="checkbox" data-notecheck="skill_${i}" ${data.notes['skill_'+i]==='ja'?'checked':''}><span>${x}</span></label>`).join('')}${field('end_open','Das möchte ich im Programmierkurs noch lernen')}`)}${endModule('end')}<section class="card"><h2>Jetzt in LearningView abgeben</h2><p>Öffne dein Logbuch, exportiere es als HTML-Dokument oder Textdatei und lade die Datei in der LearningView-Aufgabe <b>„Robotik-Grundlagen – Logbuch“</b> hoch. Falls eure Lehrkraft Fotos/Skizzen verlangt, füge diese separat hinzu.</p><div class="actions"><button class="btn" onclick="go('log')">📘 Logbuch exportieren →</button></div></section>`,
log:()=>`<div class="eyebrow">Dokumentation & Abgabe</div><h1>Mein Robotik-Logbuch</h1><p class="lead">Hier werden deine schriftlichen Antworten gesammelt. Speichere sie als Datei und gib sie in LearningView ab.</p><section class="card"><h2>Abgabe vorbereiten</h2><p><b>Name:</b> ${esc(data.name)||'<i>noch nicht eingetragen</i>'}<br><b>Klasse/Team:</b> ${esc(data.group)||'<i>noch nicht eingetragen</i>'}</p><div class="note warning"><b>Wichtig:</b> Die HTML-Datei kann nicht automatisch in LearningView schreiben. Deine Einträge werden, soweit der Browser dies erlaubt, lokal auf diesem Gerät gespeichert. Für eine verlässliche Sicherung musst du das Logbuch <b>exportieren und in LearningView hochladen</b>. Beim Wechsel des Geräts oder Löschen der Browserdaten können lokale Einträge verloren gehen.</div><div class="actions"><button class="btn" onclick="downloadReport('html')">⬇ Logbuch als HTML herunterladen</button><button class="btn secondary" onclick="downloadReport('txt')">⬇ Als Text herunterladen</button><button class="btn ghost" onclick="copyReport()">📋 Text kopieren</button></div><p id="exportStatus" class="small" role="status"></p><h3>Checkliste für LearningView</h3><ol><li>Prüfe deine Einträge auf Vollständigkeit.</li><li>Lade das Logbuch herunter.</li><li>Öffne die passende LearningView-Abgabeaufgabe.</li><li>Lade das exportierte Logbuch hoch.</li><li>Füge Fotos, Skizzen und ggf. weitere Nachweise hinzu.</li><li>Kontrolliere, ob LearningView die Abgabe bestätigt.</li></ol></section><section class="card"><h2>Deine Einträge</h2><div id="logPreview">${reportBody()}</div></section><section class="card teacher"><h2>Für die Lehrkraft: LearningView-Einrichtung</h2><p>Lege in LearningView einen Kurs „Grundlagen der Robotik“ mit den sieben Modulen und einer Abschlussaufgabe an. Binde diese HTML-Datei als Lernmaterial ein oder stelle sie als Datei zum Öffnen bereit. Erstelle eine Abgabeaufgabe „Robotik-Grundlagen – Logbuch“ mit Dateiupload sowie optional separate Foto-/Skizzenabgaben. Nur die erfolgreiche Abgabe in LearningView gilt als gesicherter Leistungsnachweis.</p><p>Die HTML-Datei benötigt für die Inhalte keine Internetverbindung. Bei direkter Einbettung können Browser-/Plattform-Sicherheitsregeln die lokale Speicherung oder Downloads einschränken; in diesem Fall Datei separat im Browser öffnen und Export testen.</p><button class="btn secondary" onclick="go('home')">Zurück zum Start</button></section>`};
const noteTitles={m1_idea:'Meine Automatisierungsidee',m1_discuss:'Diskussion: Chancen und Fragen',m1_parts:'Dobot: Komponenten',m1_transfer:'Transfer: geeignete Aufgabe',m2_axes:'Achsenbeobachtung',m2_compare:'Bauformen vergleichen',m3_predict:'Koordinaten: Vorhersage/Beobachtung',m3_terms:'Arbeitsraum/Bewegungsraum/Nullpunkt/TCP',m3_accuracy:'Genauigkeit: Fallbeispiel',m4_observe:'Bewegungsarten beobachten',m4_choice:'Bewegungsart auswählen',m4_rule:'Merksatz Bewegungsbahn',m5_compare:'Greifer vergleichen',m5_select:'Greifer auswählen',m5_cell:'Anlage mit Sensorik',m6_risk:'Sicherheitsanalyse Laserfall',m6_check:'Sicherheitsprüfungen',m7_idea:'Sortierproblem: Idee',m7_compare:'KI und klassische Automation',m7_risks:'Chancen/Risiken KI',m7_opinion:'KI und Verantwortung',end_plan:'Anlagenkonzept',end_motion:'Bewegungsplanung',end_safety:'Sicherheitskonzept',end_ai:'KI-Entscheidung',end_open:'Offene Fragen'};
function reportBody(){let parts=[];for(const [k,title] of Object.entries(noteTitles)){parts.push(`<div style="margin:0 0 18px"><b>${esc(title)}</b><div style="white-space:pre-wrap;margin-top:4px">${esc(data.notes[k]||'— Noch kein Eintrag —')}</div></div>`)}return parts.join('')};
function reportText(){let s=`ROBOTIK-GRUNDLAGEN – LERNLOGBUCH\nName: ${data.name}\nKlasse/Team: ${data.group}\nErstellt: ${new Date().toLocaleString('de-DE')}\n\n`;for(const [k,title] of Object.entries(noteTitles))s+=`${title}\n${data.notes[k]||'— Noch kein Eintrag —'}\n\n`;s+='SELBSTEINSCHÄTZUNG\n';for(let i=0;i<6;i++)s+=`Kompetenz ${i+1}: ${data.notes['skill_'+i]==='ja'?'Ja':'noch offen'}\n`;s+='\nModule abgeschlossen: '+MODULES.filter(x=>data.done[x[0]]).map(x=>x[1]).join(', ');return s};
function downloadReport(type){const name=(data.name||'Schueler').replace(/[^\p{L}\p{N}_-]/gu,'_').slice(0,45);let body,mime,ext;if(type==='txt'){body=reportText();mime='text/plain;charset=utf-8';ext='txt'}else{body=`<!doctype html><html lang="de"><head><meta charset="utf-8"><title>Robotik-Logbuch ${esc(data.name)}</title><style>body{font:16px/1.6 Arial,sans-serif;max-width:850px;margin:45px auto;color:#162b40}h1{border-bottom:3px solid #1559a7;padding-bottom:12px}h2{margin-top:30px}section{border-bottom:1px solid #ddd;padding:9px 0;white-space:pre-wrap}</style></head><body><h1>Robotik-Grundlagen – Lernlogbuch</h1><p><b>Name:</b> ${esc(data.name)}<br><b>Klasse/Team:</b> ${esc(data.group)}<br><b>Erstellt:</b> ${esc(new Date().toLocaleString('de-DE'))}</p>${Object.entries(noteTitles).map(([k,t])=>`<section><h2>${esc(t)}</h2><p>${esc(data.notes[k]||'— Noch kein Eintrag —')}</p></section>`).join('')}<h2>Selbsteinschätzung</h2><p>${Array.from({length:6},(_,i)=>`Kompetenz ${i+1}: ${data.notes['skill_'+i]==='ja'?'Ja':'noch offen'}`).join('<br>')}</p></body></html>`;mime='text/html;charset=utf-8';ext='html'}const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([body],{type:mime}));a.download=`Robotik_Logbuch_${name}.${ext}`;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},200);document.getElementById('exportStatus').textContent='Datei erstellt. Bitte jetzt in LearningView hochladen.'};
async function copyReport(){const s=reportText();try{await navigator.clipboard.writeText(s);document.getElementById('exportStatus').textContent='Text in die Zwischenablage kopiert.'}catch(e){const t=document.createElement('textarea');t.value=s;document.body.append(t);t.select();document.execCommand('copy');t.remove();document.getElementById('exportStatus').textContent='Kopierversuch abgeschlossen. Bitte Inhalt kontrollieren.'}};
function checkQuiz(id){const f=document.querySelector(`[data-quiz="${id}"]`);const chosen=f.querySelector('input:checked');const fb=document.getElementById('fb_'+id);fb.className='feedback visible '+(chosen&&Number(chosen.value)===Number(f.dataset.correct)?'ok':'no');fb.textContent=!chosen?'Wähle zuerst eine Antwort.':Number(chosen.value)===Number(f.dataset.correct)?'✓ Richtig. '+document.getElementById('ex_'+id).textContent:'Noch nicht richtig. Lies die Information erneut und versuche es noch einmal.'};
function pathShow(id,btn){['movj','movl','jump'].forEach(x=>document.getElementById(x).style.display=x===id?'':'none');document.querySelectorAll('.diagram-controls button').forEach(x=>x.classList.remove('selected'));btn.classList.add('selected');document.getElementById('pathCaption').textContent=({movj:'MOVJ: schematischer Hinweis auf eine nicht vorgegebene TCP-Bahn. Die gezeichnete Kurve ist keine berechnete reale Roboterbahn.',movl:'MOVL: vorgegebene gerade TCP-Bahn. Das Hindernis verdeutlicht, weshalb diese Bahn nicht immer geeignet ist.',jump:'JUMP: konzeptionelle Hub-/Transport-/Absenkbewegung. Die konkrete Dobot-Implementierung und Parameter bestimmen die reale Bahn.'})[id]};
function go(id){if(!pages[id])id='home';current=id;document.getElementById('content').innerHTML=pages[id]();document.querySelectorAll('[data-note]').forEach(el=>el.addEventListener('input',()=>{data.notes[el.dataset.note]=el.value;save()}));document.querySelectorAll('[data-notecheck]').forEach(el=>el.addEventListener('change',()=>{data.notes[el.dataset.notecheck]=el.checked?'ja':'nein';save()}));document.querySelectorAll('[data-done]').forEach(el=>el.addEventListener('change',()=>{data.done[el.dataset.done]=el.checked;save();navRender()}));if(id==='m4')pathShow('jump',document.querySelectorAll('.diagram-controls button')[2]);let i=MODULES.findIndex(x=>x[0]===id);if(id!=='log')document.getElementById('content').insertAdjacentHTML('beforeend',`<div class="navfoot"><button class="btn ghost" ${i<=0?'disabled':''} onclick="go('${MODULES[Math.max(0,i-1)][0]}')">← Zurück</button><button class="btn" onclick="go('${MODULES[Math.min(MODULES.length-1,i+1)][0]}')">Weiter →</button></div>`);navRender();window.scrollTo({top:0,behavior:'instant'})};
function navRender(){let completed=MODULES.filter(x=>data.done[x[0]]).length;document.getElementById('nav').innerHTML=MODULES.map(([id,title])=>`<button class="navbtn ${current===id?'active':''}" onclick="go('${id}')">${esc(title)} ${data.done[id]?'<span class="done">✓</span>':''}</button>`).join('')+`<div class="status" style="color:#c6d9e9;padding:12px 8px">${completed} von 8 Lernabschnitten markiert<div class="progress"><div style="width:${completed/8*100}%"></div></div></div>`};
go('home');
</script></body></html>
